# GOAD VirtualBox lab — single source of truth.
# Every script reads this file. Do not duplicate the VM table anywhere else.

# ---------------------------------------------------------------------------
# Domain
# ---------------------------------------------------------------------------
GOAD_DOMAIN="goad.local"
GOAD_NETBIOS="GOAD"
GOAD_FOREST_MODE="WinThreshold"          # WinThreshold = 2016 functional level

# Local Administrator password baked into autounattend.xml, and reused as the
# domain Administrator password after promotion. Lab-only credential.
GOAD_ADMIN_PASSWORD="GoadLab123!"
GOAD_SAFEMODE_PASSWORD="GoadDsrm123!"    # DSRM / safe-mode recovery password

# ---------------------------------------------------------------------------
# Networking
#
# Host-only, NOT internal. An internal network (intnet) is isolated from the
# host, so an Ansible controller running on the host cannot reach the guests.
# Host-only gives host<->guest and guest<->guest while staying off the internet.
#
# VirtualBox >= 6.1.28 refuses host-only ranges outside 192.168.56.0/21 unless
# /etc/vbox/networks.conf says otherwise. Stay inside that range.
# ---------------------------------------------------------------------------
GOAD_HOSTONLY_HOST_IP="192.168.56.1"
GOAD_SUBNET="192.168.56"
GOAD_NETMASK="255.255.255.0"
GOAD_PREFIX="24"

# ---------------------------------------------------------------------------
# VM table
#   name : os_key : ram_mb : cpus : disk_gb : host_octet : role
#
# os_key maps to an ISO and an autounattend template (see ISO_* below).
# role drives what bootstrap.ps1 pre-installs and what Ansible does later.
# Order matters: VMs are created, booted and provisioned in listed order.
# ---------------------------------------------------------------------------
LAB_VMS_full="\
dc01:win2016:3072:2:60:10:dc_root
dc02:win2016:3072:2:60:11:dc_child
srv02:win2019:3072:2:60:22:member
srv03:win2019:3072:2:60:23:member
ws01:win2019:2048:2:40:30:workstation"

LAB_VMS_light="\
dc01:win2016:3072:2:60:10:dc_root
srv02:win2019:3072:2:60:22:member
ws01:win2019:2048:2:40:30:workstation"

# Nested topology: one Server 2022 DC and three Server 2022 endpoints, all on a
# single Windows Server 2022 ISO (only --iso-win2022 is needed). Intended to run
# *inside* the Xubuntu 22.04+ L1 VM built by scripts/create-l1-host.sh. Guest
# memory is lean because all four share L1's allocation; Server 2022 Desktop
# Experience wants a little more than a Win10 client, hence 2560 for endpoints.
LAB_VMS_nested="\
dc01:win2022:4096:2:60:10:dc_root
ws01:win2022:2560:2:50:31:workstation
ws02:win2022:2560:2:50:32:workstation
ws03:win2022:2560:2:50:33:workstation"

# ---------------------------------------------------------------------------
# ISOs — override with --iso-win2016 / --iso-win2019, or export before running.
# ---------------------------------------------------------------------------
ISO_win2016="${ISO_win2016:-}"
ISO_win2019="${ISO_win2019:-}"
ISO_win2022="${ISO_win2022:-}"
ISO_win10="${ISO_win10:-}"

# Which edition inside install.wim to deploy. VERIFY THIS AGAINST YOUR MEDIA
# before a long unattended run — a wrong edition name is the single most
# common reason Setup stops and waits for input instead of proceeding:
#
#   Windows:  dism /Get-WimInfo /WimFile:D:\sources\install.wim
#   Linux:    7z l WinServer2022.iso   (then inspect sources/install.wim)
#
# Server media carries both a Core and a Desktop Experience image. Confusingly,
# the plain "SERVERSTANDARD" name is Desktop Experience and "SERVERSTANDARDCORE"
# is the GUI-less one; GOAD roles want Desktop Experience.
#
# An index is accepted instead of a name when the strings do not match:
#   IMAGE_win2022="/IMAGE/INDEX=2"
IMAGE_win2016="Windows Server 2016 SERVERSTANDARD"
IMAGE_win2019="Windows Server 2019 SERVERSTANDARD"
IMAGE_win2022="Windows Server 2022 SERVERSTANDARD"
IMAGE_win10="Windows 10 Pro"

# Firmware. VirtualBox defaults Windows guests to BIOS; the autounattend disk
# layout below is MBR to match. Set to "efi" only if you also flip the VM's
# --firmware and use the UEFI partition layout.
LAB_FIRMWARE="bios"

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
LAB_VM_BASEFOLDER="${LAB_VM_BASEFOLDER:-$HOME/VirtualBox VMs}"
LAB_BUILD_DIR="${LAB_BUILD_DIR:-}"       # defaults to <repo>/build at runtime
LAB_ISO_DIR="${LAB_ISO_DIR:-}"           # defaults to <repo>/isos at runtime

# ---------------------------------------------------------------------------
# Automatic ISO download (scripts/fetch-isos.sh)
#
# When ISO_<oskey> is unset, scripts default it to $LAB_ISO_DIR/<oskey>.iso, so
# after a fetch everything resolves with no --iso flags.
#
# Windows evaluation media comes from Microsoft's Evaluation Center via the
# stable go.microsoft.com/fwlink redirects. The 180-day evaluation is free and
# needs no key. Microsoft does not publish stable checksums for eval ISOs, so
# ISO_SHA256_<oskey> is empty for them (verification is skipped unless you fill
# one in). Override any URL if Microsoft rotates it.
#
# win2022 uses the direct prss.microsoft.com static link supplied for this lab.
# The go.microsoft.com/fwlink/?LinkID=2195280 redirect (the en-us Server 2022
# ISO, confirmed on the official evalcenter page) resolves to the same media and
# is the fallback if this static URL is ever rotated — set ISO_URL_win2022 to it
# to switch. The 2019/2016 eval pages now gate their links behind registration,
# so those IDs are widely-documented but were not verifiable here.
ISO_URL_win2022="${ISO_URL_win2022:-https://software-static.download.prss.microsoft.com/sg/download/888969d5-f34g-4e03-ac9d-1f9786c66749/SERVER_EVAL_x64FRE_en-us.iso}"
ISO_URL_win2019="${ISO_URL_win2019:-https://go.microsoft.com/fwlink/p/?LinkID=2195167&clcid=0x409&culture=en-us&country=US}"
ISO_URL_win2016="${ISO_URL_win2016:-https://go.microsoft.com/fwlink/p/?LinkID=2195174&clcid=0x409&culture=en-us&country=US}"
ISO_SHA256_win2022="${ISO_SHA256_win2022:-}"
ISO_SHA256_win2019="${ISO_SHA256_win2019:-}"
ISO_SHA256_win2016="${ISO_SHA256_win2016:-}"
# No stable direct link for the Win10 client eval; leave URL empty so fetch-isos
# reports it as manual rather than guessing.
ISO_URL_win10="${ISO_URL_win10:-}"
ISO_SHA256_win10="${ISO_SHA256_win10:-}"

# L1 host: official Xubuntu.
#
# Two ways to fetch, checked in this order by fetch-isos.sh --l1:
#   1. ISO_URL_xubuntu — an explicit direct ISO URL (what's set below). Used
#      verbatim. Checksum is verified against ISO_SHA256_xubuntu if you set one,
#      otherwise best-effort against a SHA256SUMS file in the same directory.
#   2. If ISO_URL_xubuntu is empty — discover the current point release and its
#      checksum live from $XUBUNTU_MIRROR/$XUBUNTU_RELEASE/release/SHA256SUMS.
#
# Default points at the free.fr Xubuntu mirror, release 26.04, per request.
ISO_URL_xubuntu="${ISO_URL_xubuntu:-http://ftp.free.fr/mirrors/ftp.xubuntu.com/releases/26.04/release/xubuntu-26.04-desktop-amd64.iso}"
ISO_SHA256_xubuntu="${ISO_SHA256_xubuntu:-}"
XUBUNTU_RELEASE="${XUBUNTU_RELEASE:-26.04}"
XUBUNTU_MIRROR="${XUBUNTU_MIRROR:-http://ftp.free.fr/mirrors/ftp.xubuntu.com/releases}"
