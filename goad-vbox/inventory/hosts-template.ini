# GOAD VirtualBox Ansible Inventory Template
# Copy this file to hosts.ini and update with your VM IPs and credentials

[windows:vars]
# WinRM Connection Settings
ansible_connection=winrm
ansible_winrm_transport=basic
ansible_port=5985
ansible_winrm_message_encryption=auto

# Ansible Settings
ansible_become_method=runas
ansible_language_locale=en_US

# Credentials (CUSTOMIZE THESE!)
# Note: If password contains special characters, quote them
ansible_user=Administrator
ansible_password="P@ssw0rd1"

# ============================================
# GOAD FULL VARIANT (5 VMs)
# ============================================

[windows]
# Domain Controllers (Windows Server 2016)
dc01 ansible_host=192.168.1.11 ansible_user=Administrator ansible_password="P@ssw0rd1"
dc02 ansible_host=192.168.1.12 ansible_user=Administrator ansible_password="P@ssw0rd1"

# Member Servers (Windows Server 2019)
srv02 ansible_host=192.168.1.22 ansible_user=Administrator ansible_password="P@ssw0rd1"
srv03 ansible_host=192.168.1.23 ansible_user=Administrator ansible_password="P@ssw0rd1"

# Workstations (Windows 10)
ws01 ansible_host=192.168.1.30 ansible_user=Administrator ansible_password="P@ssw0rd1"

[domain_controllers]
dc01
dc02

[member_servers]
srv02
srv03

[workstations]
ws01

# ============================================
# GOAD LIGHT VARIANT (3 VMs)
# ============================================
# Uncomment and use the section below if running GOAD-Light
# Comment out the GOAD Full section above

# [windows]
# dc01 ansible_host=192.168.1.11 ansible_user=Administrator ansible_password="P@ssw0rd1"
# srv02 ansible_host=192.168.1.22 ansible_user=Administrator ansible_password="P@ssw0rd1"
# ws01 ansible_host=192.168.1.30 ansible_user=Administrator ansible_password="P@ssw0rd1"
#
# [domain_controllers]
# dc01
#
# [member_servers]
# srv02
#
# [workstations]
# ws01

# ============================================
# GROUP VARIABLE OVERRIDES
# ============================================

# Default domain name (change if not using goad.local)
[windows:vars]
domain_name=goad.local
domain_admin_user=Administrator
domain_admin_password="P@ssw0rd1"

# DC-specific configuration
[domain_controllers:vars]
dc_role=primary
install_adcs=true
forest_mode=2016
domain_functional_level=2016

# Server-specific configuration
[member_servers:vars]
server_role=member
adcs_enabled=false

# Workstation configuration
[workstations:vars]
os_type=Windows10

# ============================================
# VAULT-BASED CREDENTIALS (OPTIONAL)
# ============================================
# For secure credential management, use Ansible Vault:
# 1. Create vault file: ansible-vault create inventory/vault.yml
# 2. Add to vault.yml:
#    vault_ansible_password: "P@ssw0rd1"
#    vault_domain_admin_password: "P@ssw0rd1"
# 3. Reference in inventory:
#    ansible_password: "{{ vault_ansible_password }}"
# 4. Run Ansible with: ansible-playbook ... --ask-vault-pass
