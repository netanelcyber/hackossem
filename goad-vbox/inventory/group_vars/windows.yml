---
# Common Windows configuration for all GOAD VMs

# Connection settings (defined in hosts.ini but can be overridden here)
# ansible_connection: winrm
# ansible_winrm_transport: basic
# ansible_port: 5985
# ansible_winrm_message_encryption: auto

# Common variables
domain_name: goad.local
domain_admin_user: Administrator
domain_admin_password: "{{ ansible_password }}"

# Timezone
timezone: UTC

# Language & locale
language_locale: en_US

# Windows update configuration
disable_windows_update: true  # Speed up lab provisioning
automatic_logon: false

# Security settings (lab only - NOT FOR PRODUCTION!)
firewall_enabled: true
windows_defender_disabled: true
uac_enabled: true

# Kerberos settings
krb5_enabled: true
krb5_encryption_types: "AES256-CTS-HMAC-SHA1-96"

# WinRM settings
winrm_service_enabled: true
winrm_basic_auth: true
winrm_https: false  # Lab only
